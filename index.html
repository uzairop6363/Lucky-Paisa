<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Lucky Paisa - Professional</title>
    <style>
        /* --- 1. CORE & BACKGROUND --- */
        body {
            margin: 0; padding: 0;
            background-color: #150020; 
            font-family: 'Segoe UI', sans-serif;
            height: 100vh; width: 100vw;
            overflow: hidden;
            display: flex; flex-direction: column; align-items: center;
        }

        .game-wrapper {
            position: relative;
            width: 100%; height: 100%;
            max-width: 500px;
            background-image: url('assets/royal_bg.jpg'); 
            background-size: cover; background-position: center;
            display: flex; flex-direction: column; align-items: center;
        }

        /* Overlay for Depth */
        .game-wrapper::before {
            content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle, rgba(0,0,0,0.2) 0%, rgba(0,0,0,0.8) 100%);
            z-index: 1; 
        }

        /* --- 2. 3D METALLIC LOGO (CSS ONLY) --- */
        .logo-area {
            margin-top: 40px;
            text-align: center;
            z-index: 10;
            position: relative;
            filter: drop-shadow(0 10px 10px rgba(0,0,0,0.8));
        }
        .logo-text {
            font-size: 52px; font-weight: 900;
            font-family: 'Arial Black', sans-serif;
            color: #ffd700;
            /* 3D Metal Effect */
            background: linear-gradient(180deg, #fff 0%, #ffd700 20%, #b8860b 50%, #ffd700 80%, #fff 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            position: relative;
            z-index: 2;
            text-transform: uppercase;
            letter-spacing: -2px;
            /* Stroke Effect */
            -webkit-text-stroke: 1px #8B4513; 
        }
        /* Logo Glow Background */
        .logo-area::after {
            content: '';
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 300px; height: 100px;
            background: radial-gradient(ellipse, rgba(255,215,0,0.4) 0%, transparent 70%);
            z-index: 1;
        }

        /* --- 3. PRO SLOT MACHINE --- */
        .slot-container {
            position: relative;
            width: 350px; height: 310px;
            margin-top: 10px;
            display: flex; justify-content: center; align-items: center;
            z-index: 5;
            filter: drop-shadow(0 20px 30px rgba(0,0,0,0.8));
        }

        .slot-frame {
            position: absolute; width: 100%; height: 100%;
            background-image: url('assets/slot_frame.png');
            background-size: 100% 100%;
            z-index: 20; pointer-events: none;
        }

        /* DARK REEL BACKGROUND (Important for contrast) */
        .reels-wrapper {
            width: 270px; height: 185px;
            display: flex; gap: 5px;
            overflow: hidden;
            position: relative;
            background: #050505; /* Pitch Black */
            border-radius: 8px;
            padding: 0 5px;
            box-shadow: inset 0 0 20px #000;
            border: 2px solid #332200;
        }

        .reel {
            flex: 1;
            display: flex; flex-direction: column;
            align-items: center;
            /* Subtle texture inside reel */
            background: repeating-linear-gradient(
                0deg,
                #0a0a0a,
                #0a0a0a 40px,
                #111 40px,
                #111 80px
            );
            border-left: 1px solid #333;
            border-right: 1px solid #333;
        }

        .reel-icon {
            width: 80px; height: 60px; /* Adjusted Aspect Ratio for Notes */
            margin: 10px 0;
            background-size: contain; background-repeat: no-repeat; background-position: center;
            filter: brightness(1.1) contrast(1.1); /* Notes Pop */
            transform: scale(1.1);
        }

        /* --- 4. CONTROLS & UI --- */
        .controls-area {
            margin-top: auto; margin-bottom: 50px;
            display: flex; flex-direction: column; align-items: center;
            z-index: 50; width: 100%;
        }

        .spin-btn {
            width: 120px; height: 120px;
            background-image: url('assets/btn_spin.png');
            background-size: 100% 100%;
            background-color: transparent; border: none;
            cursor: pointer;
            transition: transform 0.1s;
            filter: drop-shadow(0 0 25px rgba(255, 165, 0, 0.6)); /* Orange Glow */
            animation: heartbeat 1.5s infinite;
        }
        @keyframes heartbeat {
            0% { transform: scale(1); }
            5% { transform: scale(1.05); }
            10% { transform: scale(1); }
            15% { transform: scale(1.05); }
            20% { transform: scale(1); }
            100% { transform: scale(1); }
        }

        .balance-box {
            background: linear-gradient(180deg, #2a0e36 0%, #150020 100%);
            border: 2px solid #ffd700;
            padding: 10px 40px;
            border-radius: 30px;
            color: #fff; font-weight: bold; font-size: 22px;
            margin-bottom: 20px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.6), inset 0 2px 5px rgba(255,255,255,0.2);
            text-shadow: 0 2px 2px #000;
            font-family: 'Courier New', monospace;
            display: flex; align-items: center; gap: 10px;
        }
        .balance-box::before {
            content: '💰'; font-size: 18px;
        }

        /* --- 5. ULTRA WIN EFFECTS (Sunburst) --- */
        .win-overlay {
            position: absolute; top: 45%; left: 50%;
            transform: translate(-50%, -50%) scale(0);
            z-index: 100; text-align: center; pointer-events: none;
            width: 100%;
        }

        /* ROTATING RAYS BEHIND TEXT */
        .sunburst {
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 500px; height: 500px;
            background: conic-gradient(from 0deg, transparent 0deg, gold 20deg, transparent 40deg, gold 60deg, transparent 80deg, gold 100deg, transparent 120deg, gold 140deg, transparent 160deg, gold 180deg, transparent 200deg, gold 220deg, transparent 240deg, gold 260deg, transparent 280deg, gold 300deg, transparent 320deg, gold 340deg, transparent 360deg);
            opacity: 0.3;
            z-index: -1;
            animation: rotate-rays 10s infinite linear;
            border-radius: 50%;
            mask-image: radial-gradient(circle, rgba(0,0,0,1) 0%, rgba(0,0,0,0) 70%);
        }
        @keyframes rotate-rays { from { transform: translate(-50%, -50%) rotate(0deg); } to { transform: translate(-50%, -50%) rotate(360deg); } }

        .win-text {
            font-size: 65px; font-weight: 900;
            color: #fff;
            -webkit-text-stroke: 3px #b8860b;
            text-shadow: 0 5px 0 #b8860b, 0 10px 10px rgba(0,0,0,0.5);
            animation: bounce-win 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }
        .win-amount {
            font-size: 40px; color: #ffd700; font-weight: bold; margin-top: 5px;
            text-shadow: 0 2px 0 #000;
            background: rgba(0,0,0,0.6);
            padding: 5px 20px; border-radius: 10px;
            display: inline-block;
        }

        @keyframes bounce-win {
            0% { transform: scale(0); opacity: 0; }
            60% { transform: scale(1.2); opacity: 1; }
            100% { transform: scale(1); opacity: 1; }
        }

        .rain-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; overflow: hidden; z-index: 80; }
        .falling-note { position: absolute; top: -150px; width: 70px; animation: fall linear forwards; filter: drop-shadow(0 5px 5px rgba(0,0,0,0.3)); }
        @keyframes fall { to { transform: translateY(110vh) rotate(360deg); } }

    </style>
</head>
<body>

    <div class="game-wrapper">
        
        <div class="rain-container" id="rainLayer"></div>

        <div class="win-overlay" id="winMsg">
            <div class="sunburst"></div> <div class="win-text">MEGA WIN</div>
            <div class="win-amount">+5000</div>
        </div>

        <div class="logo-area">
            <div class="logo-text">LUCKY PAISA</div>
        </div>

        <div class="slot-container">
            <div class="slot-frame"></div>
            
            <div class="reels-wrapper">
                <div class="reel" id="reel1">
                    <div class="reel-icon" style="background-image: url('assets/icon_5000.png')"></div>
                    <div class="reel-icon" style="background-image: url('assets/icon_1000.png')"></div>
                    <div class="reel-icon" style="background-image: url('assets/icon_500.png')"></div>
                </div>
                <div class="reel" id="reel2">
                    <div class="reel-icon" style="background-image: url('assets/icon_5000.png')"></div>
                    <div class="reel-icon" style="background-image: url('assets/icon_100.png')"></div>
                    <div class="reel-icon" style="background-image: url('assets/icon_500.png')"></div>
                </div>
                <div class="reel" id="reel3">
                    <div class="reel-icon" style="background-image: url('assets/icon_5000.png')"></div>
                    <div class="reel-icon" style="background-image: url('assets/icon_1000.png')"></div>
                    <div class="reel-icon" style="background-image: url('assets/icon_100.png')"></div>
                </div>
            </div>
        </div>

        <div class="controls-area">
            <div class="balance-box"><span id="balance">50000</span></div>
            <button class="spin-btn" id="spinBtn" onclick="spin()"></button>
        </div>

    </div>

    <script>
        const symbols = [
            { id: 100, img: 'assets/icon_100.png', rain: 'assets/falling_100.png', name: 'GOOD WIN' },
            { id: 500, img: 'assets/icon_500.png', rain: 'assets/falling_500.png', name: 'BIG WIN' },
            { id: 1000, img: 'assets/icon_1000.png', rain: 'assets/falling_1000.png', name: 'SUPER WIN' },
            { id: 5000, img: 'assets/icon_5000.png', rain: 'assets/falling_5000.png', name: 'JACKPOT' }
        ];

        let balance = 50000;
        let isSpinning = false;
        const spinCost = 500; 

        function spin() {
            if (isSpinning) return;
            if (balance < spinCost) { alert("Insufficient Balance!"); return; }

            balance -= spinCost;
            updateBalance();
            isSpinning = true;
            document.getElementById('spinBtn').disabled = true;
            document.getElementById('spinBtn').style.filter = "grayscale(1)";
            document.getElementById('winMsg').style.transform = "translate(-50%, -50%) scale(0)";
            clearRain();

            // Faster & Sharper Spins
            startReelAnimation('reel1', 1200);
            startReelAnimation('reel2', 1800); 
            startReelAnimation('reel3', 2400); 
        }

        function startReelAnimation(reelId, duration) {
            const reel = document.getElementById(reelId);
            const interval = setInterval(() => {
                const randomSym = symbols[Math.floor(Math.random() * symbols.length)];
                reel.innerHTML = `
                    <div class="reel-icon" style="background-image: url('${getRandomIcon()}')"></div>
                    <div class="reel-icon" style="background-image: url('${randomSym.img}')"></div>
                    <div class="reel-icon" style="background-image: url('${getRandomIcon()}')"></div>
                `;
            }, 60); // Super Fast

            setTimeout(() => {
                clearInterval(interval);
                finalizeReel(reelId);
            }, duration);
        }

        function getRandomIcon() {
            return symbols[Math.floor(Math.random() * symbols.length)].img;
        }

        let results = [];

        function finalizeReel(reelId) {
            const reel = document.getElementById(reelId);
            let finalSym;
            if (results.length > 0 && Math.random() > 0.6) {
                finalSym = symbols.find(s => s.id === results[0]);
            } else {
                finalSym = symbols[Math.floor(Math.random() * symbols.length)];
            }
            if(!finalSym) finalSym = symbols[Math.floor(Math.random() * symbols.length)];

            reel.innerHTML = `
                <div class="reel-icon" style="background-image: url('${getRandomIcon()}')"></div>
                <div class="reel-icon" style="background-image: url('${finalSym.img}')" id="res-${reelId}" data-val="${finalSym.id}"></div>
                <div class="reel-icon" style="background-image: url('${getRandomIcon()}')"></div>
            `;

            if(reelId === 'reel1') results = [finalSym.id];
            else results.push(finalSym.id);

            if (results.length === 3) {
                checkWin();
                isSpinning = false;
                document.getElementById('spinBtn').disabled = false;
                document.getElementById('spinBtn').style.filter = "drop-shadow(0 0 25px rgba(255, 165, 0, 0.6))";
            }
        }

        function checkWin() {
            const val1 = results[0];
            const val2 = results[1];
            const val3 = results[2];

            if (val1 === val2 && val2 === val3) {
                const winData = symbols.find(s => s.id === val1);
                const winAmount = val1 * 5; 
                
                balance += winAmount;
                updateBalance();
                
                showWinMessage(winData.name, winAmount);
                startMoneyRain(winData.rain);
            }
        }

        function showWinMessage(text, amount) {
            const msgBox = document.getElementById('winMsg');
            msgBox.querySelector('.win-text').innerText = text;
            msgBox.querySelector('.win-amount').innerText = "PKR " + amount;
            
            // Reflow for restart animation
            msgBox.style.animation = 'none';
            msgBox.offsetHeight; 
            msgBox.style.transform = "translate(-50%, -50%) scale(1)";
        }

        function updateBalance() {
            document.getElementById('balance').innerText = balance;
        }

        function startMoneyRain(imgSrc) {
            const container = document.getElementById('rainLayer');
            for(let i=0; i<40; i++) {
                setTimeout(() => { createNote(container, imgSrc); }, i * 80);
            }
        }

        function createNote(container, src) {
            const note = document.createElement('img');
            note.src = src;
            note.classList.add('falling-note');
            note.style.left = Math.random() * 90 + "%";
            note.style.animationDuration = (Math.random() * 2 + 1.5) + "s"; 
            note.style.width = (Math.random() * 40 + 50) + "px"; 
            container.appendChild(note);
            setTimeout(() => { note.remove(); }, 3500);
        }

        function clearRain() {
            document.getElementById('rainLayer').innerHTML = '';
        }
    </script>
</body>
</html>
