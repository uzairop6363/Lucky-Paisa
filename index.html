<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Lucky Paisa - Dream Edition</title>
    <style>
        /* --- 1. CORE SETTINGS --- */
        body {
            margin: 0; padding: 0;
            background-color: #0d0015; 
            font-family: 'Segoe UI', sans-serif;
            height: 100vh; width: 100vw;
            overflow: hidden;
            display: flex; flex-direction: column; align-items: center;
        }

        .game-wrapper {
            position: relative;
            width: 100%; height: 100%;
            max-width: 500px; 
            background-image: url('assets/royal_bg.jpg'); 
            background-size: cover; background-position: center 80%; 
            display: flex; flex-direction: column; align-items: center;
            overflow: hidden;
        }

        /* Alive Overlay */
        .game-wrapper::before {
            content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at center, rgba(100,0,150,0.1) 0%, #0a0010 100%);
            animation: breatheBG 4s infinite alternate;
            z-index: 1; pointer-events: none;
        }
        @keyframes breatheBG { from{opacity:0.8;} to{opacity:1;} }

        /* --- 2. PARTICLES --- */
        .particle {
            position: absolute; background: gold; border-radius: 50%; opacity: 0.6; pointer-events: none;
            animation: floatUp linear infinite; z-index: 2;
        }
        @keyframes floatUp {
            0% { transform: translateY(100vh) scale(0.5); opacity: 0; }
            50% { opacity: 0.8; }
            100% { transform: translateY(-10vh) scale(1); opacity: 0; }
        }
        .rain-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; overflow: hidden; z-index: 90; }

        /* --- 3. UI ELEMENTS --- */
        .logo-area {
            margin-top: 30px; text-align: center; z-index: 50; position: relative;
            animation: floatLogo 3s ease-in-out infinite alternate;
        }
        .logo-img {
            width: 85%; max-width: 350px; height: auto;
            filter: drop-shadow(0 10px 20px rgba(0,0,0,0.8));
        }
        @keyframes floatLogo { from{transform:translateY(0);} to{transform:translateY(-10px);} }

        .king-char {
            position: absolute; bottom: 20px; left: -30px; width: 120%; max-width: 500px; height: auto;
            z-index: 4; pointer-events: none;
            filter: drop-shadow(0 5px 15px rgba(0,0,0,0.9)) brightness(1.1);
        }

        /* --- 4. SLOT MACHINE --- */
        .slot-container {
            position: relative; width: 360px; height: 320px; margin-top: 10px;
            display: flex; justify-content: center; align-items: center; z-index: 5; 
            filter: drop-shadow(0 30px 50px rgba(0,0,0,1));
        }
        .slot-frame {
            position: absolute; width: 100%; height: 100%;
            background-image: url('assets/slot_frame.png');
            background-size: 100% 100%; z-index: 20; pointer-events: none;
        }
        /* Glimmer */
        .slot-frame::before {
            content: ''; position: absolute; top:0; left:0; width:100%; height:100%;
            background: linear-gradient(45deg, transparent 40%, rgba(255,215,0,0.3) 50%, transparent 60%);
            background-size: 200% 200%; animation: glimmer 3s infinite; pointer-events: none; z-index: 21;
        }
        @keyframes glimmer { 0%{background-position: 100% 100%;} 100%{background-position: 0% 0%;} }

        .slot-frame::after {
            content: ''; position: absolute; top: 15%; left: 13%; width: 74%; height: 60%;
            background: linear-gradient(180deg, rgba(255,255,255,0.2) 0%, rgba(255,255,255,0) 40%);
            border-radius: 5px; pointer-events: none; z-index: 25;
        }

        .reels-window {
            width: 275px; height: 190px; display: flex; gap: 4px; overflow: hidden; position: relative;
            background: #000; border-radius: 6px; box-shadow: inset 0 0 40px #000; border: 2px solid #111;
        }
        .reel-col {
            flex: 1; position: relative;
            background: repeating-linear-gradient(0deg, #050505, #050505 40px, #0a0a0a 40px, #0a0a0a 80px);
            border-left: 1px solid #222; border-right: 1px solid #222;
        }
        .reel-strip { display: flex; flex-direction: column; align-items: center; transform: translateY(0); will-change: transform; }
        .reel-icon {
            width: 84px; height: 60px; margin: 2px 0; flex-shrink: 0;
            background-size: 90%; background-repeat: no-repeat; background-position: center;
            filter: contrast(1.15) brightness(1.1);
        }

        /* --- 5. CONTROLS --- */
        .controls-area {
            margin-top: auto; margin-bottom: 30px; width: 100%; padding: 0 25px; box-sizing: border-box; 
            display: flex; flex-direction: row; justify-content: space-between; align-items: center;
            z-index: 50; position: relative;
        }

        .spin-btn {
            width: 95px; height: 95px; background-image: url('assets/btn_spin.png');
            background-size: 100% 100%; background-color: transparent; border: none;
            cursor: pointer; transition: all 0.1s; filter: drop-shadow(0 0 15px rgba(255, 215, 0, 0.4));
        }
        .spin-btn:active { transform: scale(0.95); filter: brightness(0.8); }
        .spin-btn:disabled { filter: grayscale(1); transform: scale(0.95); cursor: not-allowed; }

        .balance-box {
            width: 190px; height: 55px; background-image: url('assets/ui_balance_royal.png');
            background-size: 100% 100%; background-repeat: no-repeat;
            display: flex; justify-content: center; align-items: center;
            padding-left: 15px; padding-bottom: 3px; filter: drop-shadow(0 5px 10px rgba(0,0,0,0.8));
        }
        .balance-text {
            color: #fffebb; font-weight: 900; font-size: 19px; font-family: 'Segoe UI', monospace;
            text-shadow: 0 2px 4px #000; letter-spacing: 0.5px;
        }

        /* --- 6. CINEMATIC WIN UI (SLOW & FOCUSED) --- */
        .win-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            /* Dark Background with Blur to Focus on Win */
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(8px);
            
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            z-index: 200; 
            opacity: 0; pointer-events: none; /* Hidden by default */
            transition: opacity 0.5s ease;
        }
        
        /* When active class added */
        .win-overlay.active {
            opacity: 1; pointer-events: all;
        }

        /* Win Image Animation (Slow Motion Entry) */
        .win-title-img {
            width: 85%; max-width: 450px; height: auto;
            display: block;
            filter: drop-shadow(0 0 30px rgba(255,215,0,0.8));
            /* Initial State */
            transform: scale(0);
        }
        
        /* Class to trigger animation */
        .animate-win-img {
            animation: majesticEntrance 1.2s cubic-bezier(0.34, 1.56, 0.64, 1) forwards, 
                       pulseHeart 2s infinite 1.2s; /* Pulse starts after entrance */
        }

        @keyframes majesticEntrance {
            0% { transform: scale(0) translateY(50px); opacity: 0; }
            60% { transform: scale(1.1); opacity: 1; }
            100% { transform: scale(1); opacity: 1; }
        }

        @keyframes pulseHeart {
            0% { transform: scale(1); filter: drop-shadow(0 0 30px rgba(255,215,0,0.8)); }
            50% { transform: scale(1.05); filter: drop-shadow(0 0 50px rgba(255,215,0,1)); }
            100% { transform: scale(1); filter: drop-shadow(0 0 30px rgba(255,215,0,0.8)); }
        }

        .win-amount-box {
            margin-top: 20px;
            background: linear-gradient(90deg, transparent, rgba(0,0,0,1), transparent);
            padding: 10px 50px;
            border-top: 3px solid gold;
            border-bottom: 3px solid gold;
            transform: scale(0); /* Hidden Initially */
            opacity: 0;
        }
        
        .animate-amount {
            animation: slideUpAmount 0.8s ease-out 0.5s forwards; /* 0.5s delay */
        }

        @keyframes slideUpAmount {
            from { transform: translateY(50px) scale(0); opacity: 0; }
            to { transform: translateY(0) scale(1); opacity: 1; }
        }

        .win-amount {
            font-size: 55px; color: #ffd700; font-weight: 900; 
            text-shadow: 0 0 20px orange; font-family: monospace;
            letter-spacing: 2px;
        }

        .sunburst {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 800px; height: 800px;
            background: conic-gradient(from 0deg, transparent 0deg, gold 10deg, transparent 20deg);
            opacity: 0.2; z-index: -1; animation: rotate-rays 20s infinite linear; border-radius: 50%;
        }
        @keyframes rotate-rays { from { transform: translate(-50%, -50%) rotate(0deg); } to { transform: translate(-50%, -50%) rotate(360deg); } }

        .falling-note { position: absolute; top: -150px; width: 65px; animation: fall linear forwards; filter: drop-shadow(0 5px 5px rgba(0,0,0,0.5)); }
        @keyframes fall { to { transform: translateY(110vh) rotate(360deg); } }
        
        .shake-screen { animation: shake 0.5s cubic-bezier(.36,.07,.19,.97) both; }
        @keyframes shake { 10%, 90% { transform: translate3d(-3px, 0, 0); } 20%, 80% { transform: translate3d(5px, 0, 0); } 30%, 50%, 70% { transform: translate3d(-7px, 0, 0); } 40%, 60% { transform: translate3d(7px, 0, 0); } }

    </style>
</head>
<body>

    <div class="game-wrapper" id="gameScreen">
        <div id="particles"></div>
        <div class="rain-container" id="rainLayer"></div>

        <div class="win-overlay" id="winMsg">
            <div class="sunburst"></div>
            <img src="" id="winImage" class="win-title-img" alt="Win">
            <div class="win-amount-box" id="winAmountBox">
                <div class="win-amount" id="winAmountText">+0</div>
            </div>
        </div>

        <div class="logo-area">
            <img src="assets/ui_logo_3d.png" class="logo-img" alt="Lucky Paisa">
        </div>

        <img src="assets/char_king_holder.png" class="king-char" alt="King">

        <div class="slot-container">
            <div class="slot-frame"></div>
            <div class="reels-window">
                <div class="reel-col"><div class="reel-strip" id="strip1"></div></div>
                <div class="reel-col"><div class="reel-strip" id="strip2"></div></div>
                <div class="reel-col"><div class="reel-strip" id="strip3"></div></div>
            </div>
        </div>

        <div class="controls-area">
            <button class="spin-btn" id="spinBtn" onclick="spin()"></button>
            <div class="balance-box">
                <span class="balance-text">PKR <span id="balance">50000</span></span>
            </div>
        </div>
    </div>

    <script>
        // --- CONFIG & ASSETS ---
        const symbols = [
            { id: 100, img: 'assets/icon_100.png', rain: 'assets/falling_100.png', type: 'big', multiplier: 3 },
            { id: 500, img: 'assets/icon_500.png', rain: 'assets/falling_500.png', type: 'super', multiplier: 5 },
            { id: 1000, img: 'assets/icon_1000.png', rain: 'assets/falling_1000.png', type: 'mega', multiplier: 8 },
            { id: 5000, img: 'assets/icon_5000.png', rain: 'assets/falling_5000.png', type: 'ultimate', multiplier: 12 }
        ];

        const winImages = {
            'big': 'assets/win_big.png',
            'super': 'assets/win_super.png',
            'mega': 'assets/win_mega.png',
            'ultimate': 'assets/win_ultimate.png'
        };

        let balance = 50000;
        const spinCost = 500; 
        const ICON_FULL_HEIGHT = 64; 

        function initReels() {
            ['strip1', 'strip2', 'strip3'].forEach(id => {
                const strip = document.getElementById(id);
                let html = '';
                for(let i=0; i<3; i++) { html += `<div class="reel-icon" style="background-image: url('${getRandomSymbol().img}')"></div>`; }
                strip.innerHTML = html;
            });
            createParticles();
        }

        function spin() {
            if (balance < spinCost) { alert("Insufficient Balance!"); return; }
            
            balance -= spinCost;
            document.getElementById('balance').innerText = balance;
            
            const btn = document.getElementById('spinBtn');
            btn.disabled = true;
            
            // RESET WIN UI (Important for re-animation)
            const winOverlay = document.getElementById('winMsg');
            const winImg = document.getElementById('winImage');
            const winAmtBox = document.getElementById('winAmountBox');
            
            winOverlay.classList.remove('active');
            winImg.classList.remove('animate-win-img');
            winAmtBox.classList.remove('animate-amount');
            
            document.getElementById('rainLayer').innerHTML = '';
            document.getElementById('gameScreen').classList.remove('shake-screen');

            // --- 50/50 WIN LOGIC ---
            const isWin = Math.random() < 0.5; 
            
            let res1, res2, res3;
            if (isWin) {
                const rand = Math.random();
                let winSymbol;
                if (rand < 0.5) winSymbol = symbols[0]; 
                else if (rand < 0.8) winSymbol = symbols[1]; 
                else if (rand < 0.95) winSymbol = symbols[2]; 
                else winSymbol = symbols[3]; 
                res1 = winSymbol; res2 = winSymbol; res3 = winSymbol;
            } else {
                res1 = getRandomSymbol();
                res2 = getRandomSymbol();
                do { res3 = getRandomSymbol(); } while (res1.id === res2.id && res2.id === res3.id);
            }
            
            rollReel('strip1', res1, 2000); 
            rollReel('strip2', res2, 2500); 
            rollReel('strip3', res3, 3000); 

            setTimeout(() => {
                if (isWin) {
                    handleWin(res1);
                }
                btn.disabled = false;
            }, 3000);
        }

        function rollReel(stripId, finalSymbol, duration) {
            const strip = document.getElementById(stripId);
            let content = strip.innerHTML; 
            for(let i=0; i<30; i++) { content += `<div class="reel-icon" style="background-image: url('${getRandomSymbol().img}')"></div>`; }
            content += `<div class="reel-icon" style="background-image: url('${getRandomSymbol().img}')"></div>`;
            content += `<div class="reel-icon" style="background-image: url('${finalSymbol.img}')" data-id="${finalSymbol.id}"></div>`;
            content += `<div class="reel-icon" style="background-image: url('${getRandomSymbol().img}')"></div>`;
            strip.innerHTML = content;
            strip.style.transition = 'none';
            strip.style.transform = 'translateY(0)';
            strip.offsetHeight; 
            const totalItems = strip.children.length;
            const moveUpPixels = (totalItems - 3) * ICON_FULL_HEIGHT; 
            strip.style.transition = `transform ${duration}ms cubic-bezier(0.45, 0.05, 0.55, 0.95)`;
            strip.style.transform = `translateY(-${moveUpPixels}px)`;
            setTimeout(() => {
                const last3HTML = `
                    <div class="reel-icon" style="background-image: url('${strip.children[totalItems-3].style.backgroundImage.slice(5, -2)}')"></div>
                    <div class="reel-icon" style="background-image: url('${finalSymbol.img}')"></div>
                    <div class="reel-icon" style="background-image: url('${strip.children[totalItems-1].style.backgroundImage.slice(5, -2)}')"></div>
                `;
                strip.style.transition = 'none';
                strip.innerHTML = last3HTML;
                strip.style.transform = 'translateY(0)';
            }, duration);
        }

        function getRandomSymbol() { return symbols[Math.floor(Math.random() * symbols.length)]; }

        function handleWin(symbol) {
            const amount = spinCost * symbol.multiplier;
            balance += amount;
            document.getElementById('balance').innerText = balance;
            
            showWinUI(symbol.type, amount);
            startRain(symbol.rain);
            
            if(symbol.type !== 'big') {
                document.getElementById('gameScreen').classList.add('shake-screen');
            }
        }

        function showWinUI(type, totalAmount) {
            const winOverlay = document.getElementById('winMsg');
            const imgEl = document.getElementById('winImage');
            const amountBox = document.getElementById('winAmountBox');
            const amountText = document.getElementById('winAmountText');
            
            // Set Image
            imgEl.src = winImages[type];
            amountText.innerText = "+0";

            // 1. Show Overlay (Dark & Blur)
            winOverlay.classList.add('active');

            // 2. Trigger Image Animation (Majestic Entrance)
            // Use setTimeout to ensure DOM reflow if needed
            setTimeout(() => {
                imgEl.classList.add('animate-win-img');
                amountBox.classList.add('animate-amount');
            }, 50);

            // 3. Start Slow Rolling Numbers (2.5 Seconds duration)
            // Wait for image to settle a bit before starting numbers (0.8s delay)
            setTimeout(() => {
                animateValue(amountText, 0, totalAmount, 2500); 
            }, 800);
        }

        function animateValue(obj, start, end, duration) {
            let startTimestamp = null;
            const step = (timestamp) => {
                if (!startTimestamp) startTimestamp = timestamp;
                const progress = Math.min((timestamp - startTimestamp) / duration, 1);
                // Cubic Bezier Ease Out for numbers
                // 1 - pow(1 - x, 3) formula for easeOutCubic
                const ease = 1 - Math.pow(1 - progress, 3);
                
                obj.innerHTML = "+" + Math.floor(ease * (end - start) + start);
                if (progress < 1) {
                    window.requestAnimationFrame(step);
                }
            };
            window.requestAnimationFrame(step);
        }

        function startRain(img) {
            const container = document.getElementById('rainLayer');
            for(let i=0; i<60; i++) {
                setTimeout(() => {
                    const el = document.createElement('img');
                    el.src = img;
                    el.className = 'falling-note';
                    el.style.left = Math.random() * 95 + '%';
                    el.style.animationDuration = (Math.random() * 1.5 + 1) + 's';
                    container.appendChild(el);
                    setTimeout(() => el.remove(), 2500);
                }, i * 40);
            }
        }

        function createParticles() {
            const pContainer = document.getElementById('particles');
            for(let i=0; i<25; i++) {
                const p = document.createElement('div');
                p.className = 'particle';
                p.style.left = Math.random() * 100 + 'vw';
                p.style.width = Math.random() * 4 + 'px'; p.style.height = p.style.width;
                p.style.animationDuration = (Math.random() * 15 + 5) + 's';
                p.style.animationDelay = Math.random() * 5 + 's';
                pContainer.appendChild(p);
            }
        }

        initReels();
    </script>
</body>
</html>
