<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Lucky Paisa - King's Edition</title>
    <style>
        /* --- 1. CORE & BACKGROUND --- */
        body {
            margin: 0; padding: 0;
            background-color: #0d0015; 
            font-family: 'Segoe UI', sans-serif;
            height: 100vh; width: 100vw;
            overflow: hidden;
            display: flex; flex-direction: column; align-items: center;
        }

        .game-wrapper {
            position: relative;
            width: 100%; height: 100%;
            max-width: 500px; 
            background-image: url('assets/royal_bg.jpg'); 
            background-size: cover; background-position: center 80%; 
            display: flex; flex-direction: column; align-items: center;
            overflow: hidden;
        }

        /* Overlay */
        .game-wrapper::before {
            content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at center, rgba(100,0,150,0.2) 0%, #0a0010 100%);
            z-index: 1; pointer-events: none;
        }

        /* --- 2. PARTICLES & RAIN --- */
        .particle {
            position: absolute; background: gold; border-radius: 50%; opacity: 0.6; pointer-events: none;
            animation: floatUp linear infinite; z-index: 2;
        }
        @keyframes floatUp {
            0% { transform: translateY(100vh) scale(0.5); opacity: 0; }
            50% { opacity: 0.8; }
            100% { transform: translateY(-10vh) scale(1); opacity: 0; }
        }
        .rain-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; overflow: hidden; z-index: 90; }

        /* --- 3. LOGO & KING --- */
        
        /* 3D LOGO */
        .logo-area {
            margin-top: 30px; text-align: center; z-index: 50; position: relative;
            animation: floatLogo 3s ease-in-out infinite alternate;
        }
        .logo-img {
            width: 85%; max-width: 350px; height: auto;
            filter: drop-shadow(0 10px 20px rgba(0,0,0,0.8));
        }
        @keyframes floatLogo { from{transform:translateY(0);} to{transform:translateY(-10px);} }

        /* KING CHARACTER (Fixed Position) */
        .king-char {
            position: absolute;
            /* Yahan change kiya hai taake King upar aaye */
            bottom: 120px; 
            left: 50%;
            transform: translateX(-50%);
            width: 135%; /* Thoda aur healthy kiya */
            max-width: 600px;
            height: auto;
            z-index: 4; /* Frame ke peeche */
            pointer-events: none;
            filter: drop-shadow(0 10px 30px rgba(0,0,0,0.9)) brightness(1.1);
        }

        /* --- 4. SLOT MACHINE --- */
        .slot-container {
            position: relative;
            width: 360px; height: 320px;
            margin-top: 5px; /* Thoda gap kam kiya King ke hath ke liye */
            display: flex; justify-content: center; align-items: center;
            z-index: 5; /* King ke aage */
            filter: drop-shadow(0 30px 50px rgba(0,0,0,1));
        }

        .slot-frame {
            position: absolute; width: 100%; height: 100%;
            background-image: url('assets/slot_frame.png');
            background-size: 100% 100%;
            z-index: 20; pointer-events: none;
        }
        /* Glass Shine */
        .slot-frame::after {
            content: ''; position: absolute; top: 15%; left: 13%; width: 74%; height: 60%;
            background: linear-gradient(180deg, rgba(255,255,255,0.2) 0%, rgba(255,255,255,0) 40%);
            border-radius: 5px; pointer-events: none; z-index: 25;
        }

        .reels-window {
            width: 275px; height: 190px;
            display: flex; gap: 4px; overflow: hidden; position: relative;
            background: #000; border-radius: 6px;
            box-shadow: inset 0 0 40px #000; border: 2px solid #111;
        }
        .reel-col {
            flex: 1; position: relative;
            background: repeating-linear-gradient(0deg, #050505, #050505 40px, #0a0a0a 40px, #0a0a0a 80px);
            border-left: 1px solid #222; border-right: 1px solid #222;
        }
        .reel-strip { display: flex; flex-direction: column; align-items: center; transform: translateY(0); will-change: transform; }
        .reel-icon {
            width: 84px; height: 60px; margin: 2px 0; flex-shrink: 0;
            background-size: 90%; background-repeat: no-repeat; background-position: center;
            filter: contrast(1.15) brightness(1.1);
        }

        /* --- 5. CONTROLS --- */
        .controls-area {
            margin-top: auto; margin-bottom: 30px;
            display: flex; flex-direction: column; align-items: center;
            z-index: 50; width: 100%; position: relative;
        }

        .spin-btn {
            width: 110px; height: 110px;
            background-image: url('assets/btn_spin.png');
            background-size: 100% 100%; background-color: transparent; border: none;
            cursor: pointer; transition: all 0.1s;
            filter: drop-shadow(0 0 25px rgba(255, 165, 0, 0.5));
            position: relative; bottom: -5px;
        }
        .spin-btn:active { transform: scale(0.95); filter: brightness(0.8); }
        .spin-btn:disabled { filter: grayscale(1); transform: scale(0.95); cursor: not-allowed; }

        /* FIXED BALANCE BOX */
        .balance-box {
            width: 230px; height: 60px;
            background-image: url('assets/ui_balance_royal.png');
            background-size: 100% 100%; background-repeat: no-repeat;
            display: flex; 
            justify-content: center; 
            align-items: center;
            padding-left: 35px; /* Crown se doori */
            padding-right: 10px;
            padding-top: 5px; /* Text ko center lane ke liye neeche kiya */
            margin-bottom: 10px;
            filter: drop-shadow(0 5px 10px rgba(0,0,0,0.7));
        }
        .balance-text {
            color: #fffebb; font-weight: 900; font-size: 20px; font-family: 'Segoe UI', monospace;
            text-shadow: 0 2px 4px #000; letter-spacing: 1px;
        }

        /* --- 6. WIN & ANIMATIONS --- */
        .shake-screen { animation: shake 0.5s cubic-bezier(.36,.07,.19,.97) both; }
        @keyframes shake { 10%, 90% { transform: translate3d(-2px, 0, 0); } 20%, 80% { transform: translate3d(4px, 0, 0); } 30%, 50%, 70% { transform: translate3d(-6px, 0, 0); } 40%, 60% { transform: translate3d(6px, 0, 0); } }

        .win-overlay {
            position: absolute; top: 45%; left: 50%; transform: translate(-50%, -50%) scale(0);
            z-index: 100; text-align: center; pointer-events: none; width: 100%;
        }
        .sunburst {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 600px; height: 600px;
            background: conic-gradient(from 0deg, transparent 0deg, gold 10deg, transparent 20deg);
            background-size: 20px 20px; opacity: 0.2; z-index: -1;
            animation: rotate-rays 10s infinite linear; border-radius: 50%;
        }
        @keyframes rotate-rays { from { transform: translate(-50%, -50%) rotate(0deg); } to { transform: translate(-50%, -50%) rotate(360deg); } }
        .win-text { font-size: 60px; font-weight: 900; color: #fff; -webkit-text-stroke: 2px #b8860b; text-shadow: 0 0 30px gold; }
        .win-amount { font-size: 35px; color: #ffd700; font-weight: bold; background: rgba(0,0,0,0.8); padding: 5px 20px; border-radius: 10px; border: 1px solid gold; display: inline-block; }
        .falling-note { position: absolute; top: -150px; width: 65px; animation: fall linear forwards; filter: drop-shadow(0 5px 5px rgba(0,0,0,0.5)); }
        @keyframes fall { to { transform: translateY(110vh) rotate(360deg); } }

    </style>
</head>
<body>

    <div class="game-wrapper" id="gameScreen">
        <div id="particles"></div>
        <div class="rain-container" id="rainLayer"></div>

        <div class="win-overlay" id="winMsg">
            <div class="sunburst"></div>
            <div class="win-text">MEGA WIN</div>
            <div class="win-amount">+5000</div>
        </div>

        <div class="logo-area">
            <img src="assets/ui_logo_3d.png" class="logo-img" alt="Lucky Paisa">
        </div>

        <img src="assets/char_king_holder.png" class="king-char" alt="King">

        <div class="slot-container">
            <div class="slot-frame"></div>
            <div class="reels-window">
                <div class="reel-col"><div class="reel-strip" id="strip1"></div></div>
                <div class="reel-col"><div class="reel-strip" id="strip2"></div></div>
                <div class="reel-col"><div class="reel-strip" id="strip3"></div></div>
            </div>
        </div>

        <div class="controls-area">
            <div class="balance-box">
                <span class="balance-text">PKR <span id="balance">50000</span></span>
            </div>
            <button class="spin-btn" id="spinBtn" onclick="spin()"></button>
        </div>

    </div>

    <script>
        // --- JS LOGIC (Unchanged - Logic is perfect) ---
        const symbols = [
            { id: 100, img: 'assets/icon_100.png', rain: 'assets/falling_100.png', name: 'GOOD WIN' },
            { id: 500, img: 'assets/icon_500.png', rain: 'assets/falling_500.png', name: 'BIG WIN' },
            { id: 1000, img: 'assets/icon_1000.png', rain: 'assets/falling_1000.png', name: 'SUPER WIN' },
            { id: 5000, img: 'assets/icon_5000.png', rain: 'assets/falling_5000.png', name: 'JACKPOT' }
        ];

        let balance = 50000;
        const spinCost = 500; 
        const ICON_FULL_HEIGHT = 64; 

        function initReels() {
            ['strip1', 'strip2', 'strip3'].forEach(id => {
                const strip = document.getElementById(id);
                let html = '';
                for(let i=0; i<3; i++) { html += `<div class="reel-icon" style="background-image: url('${getRandomSymbol().img}')"></div>`; }
                strip.innerHTML = html;
            });
            createParticles();
        }

        function spin() {
            if (balance < spinCost) { alert("Insufficient Balance!"); return; }
            balance -= spinCost;
            document.getElementById('balance').innerText = balance;
            const btn = document.getElementById('spinBtn');
            btn.disabled = true;
            document.getElementById('winMsg').style.transform = "translate(-50%, -50%) scale(0)";
            document.getElementById('rainLayer').innerHTML = '';
            document.getElementById('gameScreen').classList.remove('shake-screen');

            const res1 = getRandomSymbol();
            const res2 = getRandomSymbol();
            const res3 = getRandomSymbol();
            
            rollReel('strip1', res1, 2000); 
            rollReel('strip2', res2, 2500); 
            rollReel('strip3', res3, 3000); 

            setTimeout(() => {
                checkWin([res1.id, res2.id, res3.id]);
                btn.disabled = false;
            }, 3000);
        }

        function rollReel(stripId, finalSymbol, duration) {
            const strip = document.getElementById(stripId);
            let content = strip.innerHTML; 
            for(let i=0; i<30; i++) { content += `<div class="reel-icon" style="background-image: url('${getRandomSymbol().img}')"></div>`; }
            content += `<div class="reel-icon" style="background-image: url('${getRandomSymbol().img}')"></div>`;
            content += `<div class="reel-icon" style="background-image: url('${finalSymbol.img}')" data-id="${finalSymbol.id}"></div>`;
            content += `<div class="reel-icon" style="background-image: url('${getRandomSymbol().img}')"></div>`;
            strip.innerHTML = content;
            strip.style.transition = 'none';
            strip.style.transform = 'translateY(0)';
            strip.offsetHeight; 
            const totalItems = strip.children.length;
            const moveUpPixels = (totalItems - 3) * ICON_FULL_HEIGHT; 
            strip.style.transition = `transform ${duration}ms cubic-bezier(0.45, 0.05, 0.55, 0.95)`;
            strip.style.transform = `translateY(-${moveUpPixels}px)`;
            setTimeout(() => {
                const last3HTML = `
                    <div class="reel-icon" style="background-image: url('${strip.children[totalItems-3].style.backgroundImage.slice(5, -2)}')"></div>
                    <div class="reel-icon" style="background-image: url('${finalSymbol.img}')"></div>
                    <div class="reel-icon" style="background-image: url('${strip.children[totalItems-1].style.backgroundImage.slice(5, -2)}')"></div>
                `;
                strip.style.transition = 'none';
                strip.innerHTML = last3HTML;
                strip.style.transform = 'translateY(0)';
            }, duration);
        }

        function getRandomSymbol() { return symbols[Math.floor(Math.random() * symbols.length)]; }

        function checkWin(ids) {
            if(ids[0] === ids[1] && ids[1] === ids[2]) {
                const winSym = symbols.find(s => s.id === ids[0]);
                const amount = ids[0] * 10;
                balance += amount;
                document.getElementById('balance').innerText = balance;
                showWin(winSym.name, amount);
                startRain(winSym.rain);
                document.getElementById('gameScreen').classList.add('shake-screen');
            }
        }

        function showWin(text, amount) {
            const msg = document.getElementById('winMsg');
            msg.querySelector('.win-text').innerText = text;
            msg.querySelector('.win-amount').innerText = "+ " + amount;
            msg.style.transition = '0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275)';
            msg.style.transform = "translate(-50%, -50%) scale(1)";
        }

        function startRain(img) {
            const container = document.getElementById('rainLayer');
            for(let i=0; i<60; i++) {
                setTimeout(() => {
                    const el = document.createElement('img');
                    el.src = img;
                    el.className = 'falling-note';
                    el.style.left = Math.random() * 95 + '%';
                    el.style.animationDuration = (Math.random() * 1.5 + 1) + 's';
                    container.appendChild(el);
                    setTimeout(() => el.remove(), 2500);
                }, i * 40);
            }
        }

        function createParticles() {
            const pContainer = document.getElementById('particles');
            for(let i=0; i<25; i++) {
                const p = document.createElement('div');
                p.className = 'particle';
                p.style.left = Math.random() * 100 + 'vw';
                p.style.width = Math.random() * 4 + 'px'; p.style.height = p.style.width;
                p.style.animationDuration = (Math.random() * 15 + 5) + 's';
                p.style.animationDelay = Math.random() * 5 + 's';
                pContainer.appendChild(p);
            }
        }

        initReels();
    </script>
</body>
</html>
