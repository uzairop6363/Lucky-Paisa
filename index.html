<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Lucky Paisa - Royal Edition</title>
    <style>
        /* --- 1. CORE & BACKGROUND --- */
        body {
            margin: 0; padding: 0;
            background-color: #150020; 
            font-family: 'Segoe UI', sans-serif;
            height: 100vh; width: 100vw;
            overflow: hidden;
            display: flex; flex-direction: column; align-items: center;
        }

        .game-wrapper {
            position: relative;
            width: 100%; height: 100%;
            max-width: 500px; /* Mobile View */
            background-image: url('assets/royal_bg.jpg'); 
            background-size: cover; background-position: center;
            display: flex; flex-direction: column; align-items: center;
        }

        /* Dark Overlay for Focus (Taake background game ko kharab na kare) */
        .game-wrapper::before {
            content: '';
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle, rgba(0,0,0,0.3) 0%, rgba(0,0,0,0.95) 100%);
            z-index: 1; 
        }

        /* --- 2. HEADER & LOGO --- */
        .logo-area {
            margin-top: 50px;
            text-align: center;
            z-index: 10;
            position: relative;
        }
        .logo-text {
            font-size: 45px; font-weight: 900;
            color: #fff;
            /* Gold Gradient Text */
            background: linear-gradient(to bottom, #fffebb 0%, #ffbf00 50%, #b8860b 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            /* Sharp Shadow */
            filter: drop-shadow(0 4px 0px rgba(0,0,0,0.8));
            text-transform: uppercase;
            letter-spacing: 2px;
            animation: shine 3s infinite linear;
        }
        
        @keyframes shine {
            0% { filter: drop-shadow(0 4px 0px rgba(0,0,0,0.8)) brightness(1); }
            50% { filter: drop-shadow(0 4px 0px rgba(0,0,0,0.8)) brightness(1.3); }
            100% { filter: drop-shadow(0 4px 0px rgba(0,0,0,0.8)) brightness(1); }
        }

        /* --- 3. SLOT MACHINE (High Tech 3D) --- */
        .slot-container {
            position: relative;
            width: 360px; height: 320px;
            margin-top: 20px;
            display: flex; justify-content: center; align-items: center;
            z-index: 5;
            filter: drop-shadow(0 0 30px rgba(255, 215, 0, 0.2));
        }

        .slot-frame {
            position: absolute;
            width: 100%; height: 100%;
            background-image: url('assets/slot_frame.png');
            background-size: 100% 100%;
            z-index: 20; 
            pointer-events: none;
        }

        /* REELS (3D Curve Effect) */
        .reels-wrapper {
            width: 275px; height: 190px;
            display: flex; gap: 8px;
            overflow: hidden;
            position: relative;
            background: #000; 
            border-radius: 10px;
            padding: 0 5px;
            /* Inner Shadow taake reels gol lagen */
            box-shadow: inset 0 25px 30px rgba(0,0,0,0.9), inset 0 -25px 30px rgba(0,0,0,0.9);
        }

        .reel {
            flex: 1;
            display: flex; flex-direction: column;
            align-items: center;
            background: linear-gradient(90deg, #0a0a0a, #1a1a1a, #0a0a0a);
            border-left: 1px solid #333;
            border-right: 1px solid #333;
        }

        .reel-icon {
            width: 85px; height: 75px;
            margin: 2px 0;
            background-size: contain; background-repeat: no-repeat; background-position: center;
            /* Images Sharp Rahengi */
            image-rendering: -webkit-optimize-contrast;
        }

        /* --- 4. CONTROLS --- */
        .controls-area {
            margin-top: auto; margin-bottom: 60px;
            display: flex; flex-direction: column; align-items: center;
            z-index: 50; width: 100%;
        }

        .spin-btn {
            width: 110px; height: 110px;
            background-image: url('assets/btn_spin.png');
            background-size: contain; background-repeat: no-repeat;
            background-color: transparent; border: none;
            cursor: pointer;
            transition: transform 0.1s;
            filter: drop-shadow(0 0 15px rgba(255, 215, 0, 0.5));
            animation: pulse-btn 2s infinite;
        }
        @keyframes pulse-btn {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); filter: drop-shadow(0 0 25px rgba(255, 215, 0, 0.8)); }
            100% { transform: scale(1); }
        }

        .balance-box {
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid gold;
            padding: 12px 40px;
            border-radius: 50px;
            color: #fff; font-weight: bold; font-size: 20px;
            margin-bottom: 25px;
            box-shadow: 0 0 15px rgba(255, 215, 0, 0.2);
            text-shadow: 0 2px 4px black;
            font-family: monospace;
            backdrop-filter: blur(5px);
        }

        /* --- 5. WIN EFFECTS --- */
        .win-overlay {
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%) scale(0);
            z-index: 100; text-align: center; pointer-events: none;
            filter: drop-shadow(0 0 40px rgba(0,0,0,1));
        }
        .win-text {
            font-size: 60px; font-weight: 900;
            color: #fff;
            -webkit-text-stroke: 2px gold;
            text-shadow: 0 0 20px red;
            animation: pop-win 0.6s forwards cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .win-amount {
            font-size: 35px; color: gold; font-weight: bold; margin-top: 5px;
            text-shadow: 0 2px 5px black;
        }

        @keyframes pop-win {
            0% { transform: scale(0); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        /* Money Rain */
        .rain-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; overflow: hidden; z-index: 80; }
        .falling-note { position: absolute; top: -150px; width: 60px; animation: fall linear forwards; }
        @keyframes fall { to { transform: translateY(110vh) rotate(360deg); } }

    </style>
</head>
<body>

    <div class="game-wrapper">
        
        <div class="rain-container" id="rainLayer"></div>

        <div class="win-overlay" id="winMsg">
            <div class="win-text">MEGA WIN</div>
            <div class="win-amount">+5000</div>
        </div>

        <div class="logo-area">
            <div class="logo-text">LUCKY PAISA</div>
        </div>

        <div class="slot-container">
            <div class="slot-frame"></div>
            
            <div class="reels-wrapper">
                <div class="reel" id="reel1">
                    <div class="reel-icon" style="background-image: url('assets/icon_5000.png')"></div>
                    <div class="reel-icon" style="background-image: url('assets/icon_1000.png')"></div>
                    <div class="reel-icon" style="background-image: url('assets/icon_500.png')"></div>
                </div>
                <div class="reel" id="reel2">
                    <div class="reel-icon" style="background-image: url('assets/icon_5000.png')"></div>
                    <div class="reel-icon" style="background-image: url('assets/icon_100.png')"></div>
                    <div class="reel-icon" style="background-image: url('assets/icon_500.png')"></div>
                </div>
                <div class="reel" id="reel3">
                    <div class="reel-icon" style="background-image: url('assets/icon_5000.png')"></div>
                    <div class="reel-icon" style="background-image: url('assets/icon_1000.png')"></div>
                    <div class="reel-icon" style="background-image: url('assets/icon_100.png')"></div>
                </div>
            </div>
        </div>

        <div class="controls-area">
            <div class="balance-box">PKR <span id="balance">50000</span></div>
            <button class="spin-btn" id="spinBtn" onclick="spin()"></button>
        </div>

    </div>

    <script>
        // --- CONFIG ---
        const symbols = [
            { id: 100, img: 'assets/icon_100.png', rain: 'assets/falling_100.png', name: 'GOOD WIN' },
            { id: 500, img: 'assets/icon_500.png', rain: 'assets/falling_500.png', name: 'BIG WIN' },
            { id: 1000, img: 'assets/icon_1000.png', rain: 'assets/falling_1000.png', name: 'SUPER WIN' },
            { id: 5000, img: 'assets/icon_5000.png', rain: 'assets/falling_5000.png', name: 'JACKPOT' }
        ];

        let balance = 50000;
        let isSpinning = false;
        const spinCost = 500; // Cost per spin

        // --- GAME LOGIC ---
        function spin() {
            if (isSpinning) return;
            if (balance < spinCost) { alert("Insufficient Balance!"); return; }

            // Deduct & Reset
            balance -= spinCost;
            updateBalance();
            isSpinning = true;
            document.getElementById('spinBtn').disabled = true;
            document.getElementById('spinBtn').style.filter = "grayscale(1)";
            document.getElementById('winMsg').style.transform = "translate(-50%, -50%) scale(0)";
            clearRain();

            // Start Animation for each reel
            // NOTE: No blur class added anymore
            startReelAnimation('reel1', 1500);
            startReelAnimation('reel2', 2000); 
            startReelAnimation('reel3', 2500); 
        }

        function startReelAnimation(reelId, duration) {
            const reel = document.getElementById(reelId);
            
            // Fast swapping loop (Sharp Images)
            const interval = setInterval(() => {
                const randomSym = symbols[Math.floor(Math.random() * symbols.length)];
                reel.innerHTML = `
                    <div class="reel-icon" style="background-image: url('${getRandomIcon()}')"></div>
                    <div class="reel-icon" style="background-image: url('${randomSym.img}')"></div>
                    <div class="reel-icon" style="background-image: url('${getRandomIcon()}')"></div>
                `;
            }, 80); // 80ms speed (Fast enough to look smooth, slow enough to be sharp)

            setTimeout(() => {
                clearInterval(interval);
                finalizeReel(reelId);
            }, duration);
        }

        function getRandomIcon() {
            return symbols[Math.floor(Math.random() * symbols.length)].img;
        }

        let results = [];

        function finalizeReel(reelId) {
            const reel = document.getElementById(reelId);
            
            // Logic to determine result
            let finalSym;
            // 35% chance to force match if it's reel 2 or 3
            if (results.length > 0 && Math.random() > 0.65) {
                finalSym = symbols.find(s => s.id === results[0]);
            } else {
                finalSym = symbols[Math.floor(Math.random() * symbols.length)];
            }
            if(!finalSym) finalSym = symbols[Math.floor(Math.random() * symbols.length)];

            // Render Final Result (Sharp)
            reel.innerHTML = `
                <div class="reel-icon" style="background-image: url('${getRandomIcon()}')"></div>
                <div class="reel-icon" style="background-image: url('${finalSym.img}')" id="res-${reelId}" data-val="${finalSym.id}"></div>
                <div class="reel-icon" style="background-image: url('${getRandomIcon()}')"></div>
            `;

            if(reelId === 'reel1') results = [finalSym.id];
            else results.push(finalSym.id);

            // If all 3 done
            if (results.length === 3) {
                checkWin();
                isSpinning = false;
                document.getElementById('spinBtn').disabled = false;
                document.getElementById('spinBtn').style.filter = "drop-shadow(0 0 15px rgba(255, 215, 0, 0.5))";
            }
        }

        function checkWin() {
            const val1 = results[0];
            const val2 = results[1];
            const val3 = results[2];

            if (val1 === val2 && val2 === val3) {
                const winData = symbols.find(s => s.id === val1);
                const winAmount = val1 * 5; // 5x Multiplier
                
                balance += winAmount;
                updateBalance();
                
                showWinMessage(winData.name, winAmount);
                startMoneyRain(winData.rain);
            }
        }

        function showWinMessage(text, amount) {
            const msgBox = document.getElementById('winMsg');
            msgBox.querySelector('.win-text').innerText = text;
            msgBox.querySelector('.win-amount').innerText = "PKR " + amount;
            
            // Trigger Animation
            msgBox.style.animation = 'none';
            msgBox.offsetHeight; /* trigger reflow */
            msgBox.style.animation = 'pop-win 0.5s forwards cubic-bezier(0.175, 0.885, 0.32, 1.275)';
            msgBox.style.transform = "translate(-50%, -50%) scale(1)";
        }

        function updateBalance() {
            document.getElementById('balance').innerText = balance;
        }

        function startMoneyRain(imgSrc) {
            const container = document.getElementById('rainLayer');
            for(let i=0; i<40; i++) {
                setTimeout(() => { createNote(container, imgSrc); }, i * 80);
            }
        }

        function createNote(container, src) {
            const note = document.createElement('img');
            note.src = src;
            note.classList.add('falling-note');
            note.style.left = Math.random() * 90 + "%";
            note.style.animationDuration = (Math.random() * 2 + 1.5) + "s"; 
            note.style.width = (Math.random() * 50 + 40) + "px"; 
            container.appendChild(note);
            setTimeout(() => { note.remove(); }, 3500);
        }

        function clearRain() {
            document.getElementById('rainLayer').innerHTML = '';
        }

    </script>
</body>
</html>
